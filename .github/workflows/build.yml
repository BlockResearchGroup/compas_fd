name: package checks and artifacts

on:
  pull_request:
  push:
    branches: [main, initiative/compas3-foundations]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.12.7"
      - run: uv sync --locked
      - run: uv run --no-sync ruff check src tests docs/examples
      - run: uv run --no-sync ruff format --check src tests docs/examples
      - run: uv run --no-sync pyright
      - run: uv run --no-sync pytest --doctest-modules src/compas_fd tests
      - run: uv run --no-sync python docs/examples/loaded_network.py

  build:
    needs: quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.12.7"
      - run: uv sync --locked --only-group dev --no-install-project
      - run: uv run --no-sync python -m build --no-isolation --outdir dist
      - run: uv run --no-sync twine check --strict dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compas-fd-${{ github.sha }}
          path: dist/*
          if-no-files-found: error

  installed-tests:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        python: ["3.12", "3.13", "3.14"]
        distribution: [wheel, sdist]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.12.7"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: compas-fd-${{ github.sha }}
          path: dist
      - run: uv sync --locked --no-install-project --python ${{ matrix.python }}
      - name: Install verified wheel
        if: matrix.distribution == 'wheel'
        shell: bash
        run: uv pip install --no-deps dist/*.whl
      - name: Install verified sdist
        if: matrix.distribution == 'sdist'
        shell: bash
        run: uv pip install --no-deps --no-build-isolation dist/*.tar.gz
      - name: Confirm the package is imported from the environment
        run: uv run --no-sync python -I -c "import compas_fd, pathlib, sysconfig; assert pathlib.Path(compas_fd.__file__).resolve().is_relative_to(sysconfig.get_path('purelib'))"
      - run: uv run --no-sync pytest tests
