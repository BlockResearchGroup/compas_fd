name: build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  Build:
    if: "!contains(github.event.pull_request.labels.*.name, 'docs-only')"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        python: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # COMPAS 3 is not on PyPI yet: install the pinned core revision
      # (BRG Framework, compas3-migration ADR 002) from Git.
      - name: Install COMPAS at the pinned revision
        run: python -m pip install "compas @ git+https://github.com/compas-dev/compas.git@99b82a6673ff7d05c1c323c8921135c274993f11"

      - name: Install compas_fd
        run: python -m pip install --no-deps .

      - name: Install test tools
        run: python -m pip install "pytest>=9,<10" "ruff==0.17.6"

      - name: Test
        run: python -m pytest

      - name: Lint
        run: python -m ruff check src tests

      - name: Format
        run: python -m ruff format --check src tests
